[project]
name = "hala-api"
version = "0.1.0"
description = "HALA API — Arabic threat intelligence REST API"
requires-python = ">=3.9"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.1",
    "httpx>=0.27",
    "phonenumbers>=8.13",
    "slowapi>=0.1.9",
    "python-dotenv>=1.0",
    "hala-arab>=0.4.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hala_api"]
